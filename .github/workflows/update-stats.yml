name: Update NHL stats

on:
  schedule:
    # Wakes up every 10 minutes. update_stats.py decides whether there is anything to do:
    # it only contacts the NHL at 3 AM / 3 PM Eastern and around game times, and otherwise stops in a second.
    - cron: "*/10 * * * *"
  workflow_dispatch:   # adds a "Run workflow" button so you can update by hand

permissions:
  contents: write      # lets the job save the new numbers back into this repository

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Get new numbers from the NHL (only when needed)
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 update_stats.py

      - name: Save the new numbers
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Update stats $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
