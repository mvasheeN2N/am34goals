<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drive for 50</title>
<meta name="description" content="One player&rsquo;s chase for 50 goals.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'self' https://api-web.nhle.com https://search.d3.nhle.com; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}


/* Layout concept: a scoreboard. Quip banner on top, two player cards side by side (stacked on phones), one head-to-head race chart below. Blue = Matthews, orange = McDavid. */
:root{
  --bg:#0b121b;
  --surface:#121b27;
  --ink:#e8eff7;
  --muted:#92a3b8;
  --line:#233245;
  --grid:#1b2736;
  --mat:#79a9f2;
  --mat-soft:#16325a;
  --mcd:#ff8d52;
  --mcd-soft:#4a2410;
  --tie-soft:#1c2837;
  --warn:#e2b04d;
  --stink:#8fc12a;
  --gold:#f2c94c;
  --gold-hi:#fff1a8;
  color-scheme:dark;
  --good:#5ccf97;
  --good-soft:#123b29;
  --bad:#ff9482;
  --bad-soft:#4a1f19;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b121b;
    --surface:#121b27;
    --ink:#e8eff7;
    --muted:#92a3b8;
    --line:#233245;
    --grid:#1b2736;
    --mat:#79a9f2;
    --mat-soft:#16325a;
    --mcd:#ff8d52;
    --mcd-soft:#4a2410;
    --tie-soft:#1c2837;
    --warn:#e2b04d;
    --good:#5ccf97;
    --good-soft:#123b29;
    --bad:#ff9482;
    --bad-soft:#4a1f19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b121b;
  --surface:#121b27;
  --ink:#e8eff7;
  --muted:#92a3b8;
  --line:#233245;
  --grid:#1b2736;
  --mat:#79a9f2;
  --mat-soft:#16325a;
  --mcd:#ff8d52;
  --mcd-soft:#4a2410;
  --tie-soft:#1c2837;
  --warn:#e2b04d;
  --good:#5ccf97;
  --good-soft:#123b29;
  --bad:#ff9482;
  --bad-soft:#4a1f19;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.45;
  padding-block:24px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.eyebrow{margin:0 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1;letter-spacing:.01em;text-wrap:balance}
h1 .vs{color:var(--muted);font-weight:500;font-size:.6em;padding:0 .2em;text-transform:lowercase}
button:focus-visible{outline:2px solid var(--mat);outline-offset:2px}

.banner{border-radius:8px;padding:18px 20px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--tie-soft)}
.banner.is-mat{background:var(--mat-soft)}
.banner.is-mcd{background:var(--mcd-soft)}
.tag{margin:0;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.is-mat .tag{color:var(--mat)}
.is-mcd .tag{color:var(--mcd)}
.quip{margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(24px,4.6vw,36px);line-height:1.12;text-wrap:balance;max-width:34ch}
.ghost{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:transparent;border:1px solid currentColor;border-radius:6px;padding:7px 12px;cursor:pointer;min-height:36px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px}
@media (max-width:720px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05}
.mat h2{color:var(--mat)}
.mcd h2{color:var(--mcd)}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.chip{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:5px;white-space:nowrap}
.mat .chip{background:var(--mat);color:var(--bg)}
.mcd .chip{background:var(--mcd);color:var(--bg)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.stat{border:1px solid var(--line);border-radius:7px;padding:9px 10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat dd{margin:0;font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat.on{background:var(--tie-soft);border-color:transparent}
.mat .stat.on{background:var(--mat-soft)}
.mcd .stat.on{background:var(--mcd-soft)}

.block-title{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg{display:block;width:100%;height:auto;max-width:100%}
.gridline{stroke:var(--grid);stroke-width:1}
.axis{fill:var(--muted);font-family:var(--font-body);font-size:11px;font-variant-numeric:tabular-nums}
.l-mat{stroke:var(--mat);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.l-mcd{stroke:var(--mcd);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.a-mat{fill:var(--mat);fill-opacity:.14;stroke:none}
.a-mcd{fill:var(--mcd);fill-opacity:.14;stroke:none}
.d-mat{fill:var(--mat)}
.d-mcd{fill:var(--mcd)}
.t-mat{fill:var(--mat);font-family:var(--font-display);font-weight:700;font-size:15px}
.t-mcd{fill:var(--mcd);font-family:var(--font-display);font-weight:700;font-size:15px}

.scroll{overflow-x:auto}
table.log{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.log th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:4px 8px;border-bottom:1px solid var(--line)}
.log td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--grid)}
.log th:first-child,.log td:first-child,.log th:nth-child(2),.log td:nth-child(2){text-align:left}

.race{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.race h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:24px}
.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.foot p{margin:0}
.stale{color:var(--warn);font-weight:600}
.empty{padding:28px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){
  .quip{animation:rise .35s ease-out}
  @keyframes rise{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
}
.card{position:relative}

/* Leader glow: lives INSIDE the card edges, so it never washes over the text around the card */
.glow{
  border-color:color-mix(in srgb,var(--gold) 70%,var(--surface));
  box-shadow:inset 0 0 24px 2px color-mix(in srgb,var(--gold) 46%,transparent),inset 0 0 64px 6px color-mix(in srgb,var(--gold) 26%,transparent),inset 0 0 120px 14px color-mix(in srgb,var(--gold) 12%,transparent);
}
.glow::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 50% at 18% 6%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 72%),radial-gradient(60% 50% at 86% 96%,color-mix(in srgb,#ffe27a 20%,transparent),transparent 72%),radial-gradient(45% 45% at 96% 12%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 72%),radial-gradient(45% 45% at 4% 92%,color-mix(in srgb,#fff1a8 12%,transparent),transparent 72%);
}
.stench{
  border-color:color-mix(in srgb,var(--stink) 80%,var(--line));
  box-shadow:inset 0 0 26px 2px color-mix(in srgb,var(--stink) 40%,transparent),inset 0 0 70px 8px color-mix(in srgb,var(--stink) 22%,transparent);
}
.stench::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 55% at 15% 88%,color-mix(in srgb,var(--stink) 24%,transparent),transparent 72%),radial-gradient(55% 55% at 86% 14%,color-mix(in srgb,#b6c93a 20%,transparent),transparent 72%),radial-gradient(45% 45% at 50% 100%,color-mix(in srgb,var(--stink) 18%,transparent),transparent 72%);
}
.aura{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden;border-radius:inherit}
.puff{
  --k:1;position:absolute;left:var(--x);top:var(--y);
  width:calc(var(--w) * var(--k));height:calc(var(--w) * var(--k));
  margin:calc(var(--w) * var(--k) / -2) 0 0 calc(var(--w) * var(--k) / -2);
  border-radius:50%;opacity:.6;
}
.glow .puff{background:radial-gradient(closest-side,#fff,color-mix(in srgb,var(--gold) 65%,transparent) 50%,transparent);filter:blur(1px)}
.stench .puff{--k:2.6;background:radial-gradient(closest-side,color-mix(in srgb,var(--stink) 92%,transparent),transparent);filter:blur(6px)}
@media (prefers-reduced-motion:no-preference){
  .glow{animation:halo 3.2s ease-in-out infinite}
  .glow::before{animation:drift 6s ease-in-out infinite alternate}
  .stench{animation:stink 2.4s ease-in-out infinite}
  .stench::before{animation:drift 5s ease-in-out infinite alternate}
  .stench h2{animation:queasy 2.2s ease-in-out infinite}
  .glow .puff{animation:twinkle 3s ease-out var(--d) infinite}
  .stench .puff{animation:waft 3.6s ease-in-out var(--d) infinite}
  @keyframes halo{
    0%,100%{box-shadow:inset 0 0 24px 2px color-mix(in srgb,var(--gold) 46%,transparent),inset 0 0 64px 6px color-mix(in srgb,var(--gold) 26%,transparent),inset 0 0 120px 14px color-mix(in srgb,var(--gold) 12%,transparent)}
    50%{box-shadow:inset 0 0 34px 6px color-mix(in srgb,var(--gold) 62%,transparent),inset 0 0 84px 12px color-mix(in srgb,var(--gold) 36%,transparent),inset 0 0 140px 22px color-mix(in srgb,var(--gold) 18%,transparent)}
  }
  @keyframes stink{
    0%,100%{box-shadow:inset 0 0 26px 2px color-mix(in srgb,var(--stink) 40%,transparent),inset 0 0 70px 8px color-mix(in srgb,var(--stink) 22%,transparent)}
    50%{box-shadow:inset 0 0 36px 6px color-mix(in srgb,var(--stink) 56%,transparent),inset 0 0 90px 14px color-mix(in srgb,var(--stink) 32%,transparent)}
  }
  @keyframes drift{from{transform:translate(-8px,-5px) scale(1)}to{transform:translate(8px,5px) scale(1.05)}}
  @keyframes twinkle{
    0%{transform:translate(0,0) scale(.3);opacity:0}
    25%{opacity:1}
    100%{transform:translate(calc(var(--dx) * -54px),calc(var(--dy) * -54px)) scale(1.1);opacity:0}
  }
  @keyframes waft{
    0%{transform:translate(0,0) scale(.5);opacity:0}
    20%{opacity:.9}
    60%{transform:translate(calc(var(--dx) * -36px - 6px),calc(var(--dy) * -36px - 12px)) scale(1)}
    100%{transform:translate(calc(var(--dx) * -74px - 6px),calc(var(--dy) * -74px - 28px)) scale(1.7);opacity:0}
  }
  @keyframes queasy{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px) rotate(-.4deg)}75%{transform:translateX(1.5px) rotate(.4deg)}}
}

/* Matthews leads: champion treatment (gold trim, hanging banner, podium lift) */
.glow{
  border:2px solid transparent;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#f6e27a,#c9a227 30%,#fff1a8 50%,#b8901f 72%,#f0d060) border-box;
  margin-inline:-6px;
}
.glow h2{position:relative;display:inline-block;vertical-align:top;overflow:hidden}
.glow h2::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,236,150,.85) 50%,transparent 65%);transform:translateX(-120%)}
.pennant{
  position:absolute;top:-2px;right:22px;width:58px;height:88px;padding-top:10px;z-index:3;
  display:flex;flex-direction:column;align-items:center;gap:2px;transform-origin:50% 0;
  background:linear-gradient(180deg,#f6e27a,#d9b53a 55%,#b8901f);color:#14223d;
  clip-path:polygon(0 0,100% 0,100% 84%,50% 100%,0 84%);pointer-events:none;
}
.pennant .n{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1}
.pennant .t{font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-align:center;line-height:1.15}
.trail{margin-inline:6px;filter:saturate(.65) brightness(.92);opacity:.9}
#confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:60}

/* McDavid leads: decrepit treatment (aged, cracked, cobwebbed, crooked, flickering, taped off) */
.stench{transform:rotate(-1.2deg);transform-origin:14% 0}
.stench > :not(.aura):not(.decay):not(.hat){filter:sepia(.55) saturate(.75) brightness(.96)}
.decay{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:10px}
.web{position:absolute;width:96px;height:96px;stroke:var(--ink);fill:none;stroke-width:.8;opacity:.4}
.web-tl{left:0;top:0}
.web-br{right:0;bottom:0;transform:rotate(180deg)}
.crack{position:absolute;right:0;top:0;width:150px;height:auto;fill:none;stroke-linejoin:round;stroke-linecap:round}
.crack .c1{stroke:var(--ink);stroke-width:1.5;opacity:.5}
.crack .c2{stroke:var(--surface);stroke-width:1.2;opacity:.85;transform:translate(1.4px,1.4px)}
.blackout{position:absolute;inset:0;border-radius:10px;background:var(--bg);opacity:0}
.tape{
  position:absolute;left:-12px;right:-12px;top:-12px;height:24px;overflow:hidden;transform:rotate(-1.6deg);
  display:flex;justify-content:space-around;align-items:center;
  background:repeating-linear-gradient(-45deg,#f2c500 0 9px,#1a1a1a 9px 18px);box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.tape span{background:#f2c500;color:#141414;font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;padding:0 12px;line-height:24px;white-space:nowrap}
@media (max-width:520px){.tape span:nth-child(3){display:none}}
@media (prefers-reduced-motion:no-preference){
  .glow h2::after{animation:sheen 4.2s ease-in-out infinite}
  .pennant{animation:flap 3.4s ease-in-out infinite}
  .stench{animation:stink 2.4s ease-in-out infinite,sway 6s ease-in-out infinite}
  .blackout{animation:flicker 7s linear infinite}
  .banner.is-mcd .tag,.banner.is-mcd .quip{animation:txtflick 6s linear infinite}
  @keyframes sheen{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
  @keyframes flap{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
  @keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(-.5deg)}}
  @keyframes flicker{
    0%,60%,65%,89%,92%,100%{opacity:0}
    61%{opacity:.5}62%{opacity:0}63%{opacity:.6}64%{opacity:.1}
    90%{opacity:.4}91%{opacity:0}
  }
  @keyframes txtflick{0%,70%,74%,100%{opacity:1}71%{opacity:.35}72%{opacity:1}73%{opacity:.5}}
}


/* ===== Royal treatment (Matthews leads): gold letters, serif caps, a crown ===== */
.glow{padding-top:32px}
.glow h2{
  font-family:'Cinzel',Georgia,'Times New Roman',serif;font-weight:900;font-size:26px;letter-spacing:.03em;line-height:1.15;
  background:linear-gradient(180deg,#fff3b0 0%,#f2c94c 45%,#b8861b 100%);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 5px rgba(242,201,76,.35));
}
.glow .sub{color:#d9c27a;letter-spacing:.04em}
.glow .stat dd{color:var(--gold);text-shadow:0 0 12px rgba(242,201,76,.35)}
.glow .stat dt{color:#d9c27a}
.glow .stat{border-color:color-mix(in srgb,var(--gold) 38%,var(--line))}
.glow .block-title{color:#d9c27a}
.glow .l-mat{stroke:var(--gold)}
.glow .a-mat{fill:var(--gold);fill-opacity:.16}
.glow .d-mat{fill:var(--gold)}
.glow .t-mat{fill:var(--gold)}
.crown{position:absolute;left:20px;top:-38px;width:74px;z-index:4;transform:rotate(-7deg);transform-origin:50% 100%;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.crown svg{display:block;width:100%;height:auto;overflow:visible}
.crown .glint{fill:#fff;opacity:0}

/* ===== Court-jester treatment (McDavid leads): jester hat, cracked and broken lettering ===== */
.stench{padding-top:36px}
.stench h2{
  font-family:'Rubik Distressed','Special Elite',Impact,'Arial Black',sans-serif;font-weight:400;font-size:26px;letter-spacing:.03em;line-height:1.1;
  transform:skewX(-5deg) rotate(.6deg);transform-origin:0 100%;
  text-shadow:2px 0 rgba(168,50,31,.55),-2px 1px rgba(60,160,120,.35),0 0 1px rgba(0,0,0,.6);
}
.stench h2,.stench .sub{opacity:.92}
.hat{position:absolute;left:12px;top:-52px;width:98px;z-index:5;transform:rotate(-13deg);transform-origin:50% 100%;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.hat svg{display:block;width:100%;height:auto;overflow:visible}
#cards{margin-top:clamp(26px,3vh,40px)}
@media (prefers-reduced-motion:no-preference){
  .crown{animation:bob 3.6s ease-in-out infinite}
  .crown .glint{animation:glint 3.4s ease-in-out infinite}
  .crown .glint.g2{animation-delay:1.1s}
  .crown .glint.g3{animation-delay:2.2s}
  .hat{animation:jingle 2.6s ease-in-out infinite}
  .stench h2{animation:queasy 2.2s ease-in-out infinite,shatter 5.5s steps(1,end) infinite}
  @keyframes bob{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(-5deg) translateY(-3px)}}
  @keyframes glint{0%,70%,100%{opacity:0;transform:scale(.3)}80%{opacity:1;transform:scale(1.15)}90%{opacity:0;transform:scale(.4)}}
  @keyframes jingle{0%,100%{transform:rotate(-13deg)}25%{transform:rotate(-8deg)}50%{transform:rotate(-15deg)}75%{transform:rotate(-9deg)}}
  @keyframes shatter{0%,88%,100%{clip-path:none;text-shadow:2px 0 rgba(168,50,31,.55),-2px 1px rgba(60,160,120,.35)}89%{clip-path:inset(0 0 55% 0);text-shadow:-5px 0 rgba(168,50,31,.7),4px 0 rgba(60,160,120,.5)}90%{clip-path:inset(45% 0 0 0);text-shadow:5px 0 rgba(168,50,31,.7),-4px 0 rgba(60,160,120,.5)}91%{clip-path:none}}
}


/* ===== Extras: badges, tonight / live tag, facts strip, recap bar, goal toast ===== */
.bdgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bdg{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;line-height:1.2;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.bdg svg{width:14px;height:14px;flex:none}
.bdg.tonight{color:var(--good);background:var(--good-soft);border-color:transparent}
.bdg.next{color:var(--muted)}
.bdg.live{color:#fff;background:#c4262e;border-color:#c4262e}
.bdg.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.bdg.hot{color:#ffa142;border-color:color-mix(in srgb,#ffa142 45%,transparent);background:color-mix(in srgb,#ff7a1a 14%,transparent)}
.bdg.cold{color:#86d6ff;border-color:color-mix(in srgb,#86d6ff 45%,transparent);background:color-mix(in srgb,#86d6ff 12%,transparent)}
.bdg.gold{color:#2a1d00;background:linear-gradient(180deg,#fff3b0,#f2c94c);border-color:#b8861b}
.who{flex:1 1 0;min-width:0}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.nm h2{flex:none;white-space:nowrap}

.gm .bdg{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.glow .who{padding-right:70px}
a.mon{display:inline-flex;align-items:center;text-decoration:none}
.mon[hidden]{display:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0}
.fact{border:1px solid var(--line);border-radius:7px;padding:9px 12px 8px;background:var(--surface);min-width:0}
.fact dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact dd{margin:2px 0 0;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.fact .fsub{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;white-space:normal;margin-top:2px}
.fm{color:var(--mat)}
.fc{color:var(--mcd)}
.fd{color:var(--muted);font-weight:600}
.bar{display:flex;align-items:center;gap:14px;min-width:0}
.recap{flex:1;min-width:0;overflow:hidden;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.rcopy{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 20px}
.rcopy .lbl{font-family:var(--font-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.rcopy b{color:var(--ink);font-weight:700}
.rcopy b.rm{color:var(--mat)}
.rcopy b.rc{color:var(--mcd)}
.rtrack{display:block}
.rtrack.run{display:inline-flex;white-space:nowrap}
.rtrack.run .rcopy{flex-wrap:nowrap;white-space:nowrap;padding-right:3em;gap:0 3em}
#toast{position:fixed;left:50%;top:7vh;z-index:70;max-width:min(92vw,980px);text-align:center;padding:14px 30px 16px;border-radius:14px;opacity:0;transform:translate(-50%,-24px) scale(.96);pointer-events:none;transition:opacity .35s ease,transform .35s ease;box-shadow:0 12px 40px rgba(0,0,0,.55)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.mat{background:linear-gradient(180deg,#fff3b0,#f2c94c 55%,#b8861b);color:#241a00;border:2px solid #fff1a8}
#toast.mcd{background:#4a2410;color:#ffd7bd;border:2px solid var(--mcd)}
#toast .t1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5.2vh,58px);line-height:1.05;letter-spacing:.05em;text-transform:uppercase}
#toast .t2{font-size:clamp(14px,2.3vh,24px);margin-top:4px;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .bdg.live::before{animation:livepulse 1.1s ease-in-out infinite}
  .bdg.tonight{animation:tonightpulse 2.4s ease-in-out infinite}
  .bdg.hot svg{animation:flicker2 1.3s ease-in-out infinite;transform-origin:50% 90%}
  .rtrack.run{animation:ticker var(--dur,40s) linear infinite}
  @keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  @keyframes tonightpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
  @keyframes flicker2{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18,1.08) rotate(3deg)}}
  @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
}

/* Race to 50: Matthews' goals, the principal bet */
.track{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.track-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px}
.track h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05;color:var(--mat)}
.track .sub{margin:3px 0 0}
.track .big{font-family:var(--font-display);font-weight:700;font-size:46px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.track .big small{font-size:24px;color:var(--muted);font-weight:600}
.meter-wrap{padding-top:22px}
.meter{position:relative;height:18px;border-radius:9px;background:var(--grid)}
.meter-fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--mat),color-mix(in srgb,var(--mat) 65%,#9fd0ff))}
.pace{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);transform:translateX(-1px)}
.pace-label{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.pace.early .pace-label{left:0;transform:none}
.pace.late .pace-label{left:auto;right:0;transform:none}
.scale{position:relative;height:18px;margin-top:6px}
.scale span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.scale span:first-child{transform:none}
.scale span:last-child{transform:translateX(-100%)}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.12em;text-transform:uppercase;padding:5px 14px 5px 11px;border-radius:6px;white-space:nowrap}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.done{background:var(--ink);color:var(--bg)}
.verdict p{margin:0;flex:1 1 280px;min-width:0}
.t-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:0}
.track .note{margin:0;font-size:12px;color:var(--muted)}

<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">2026-27 regular season &middot; the chase for 50 goals</p>
      <h1 id="h1">Matthews&rsquo; drive for 50</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="ctrls">
      <a class="mon" id="navlink" href="index.html" hidden>Back to the showdown</a>
      <button type="button" class="mon" id="pickbtn" hidden>Player</button>
      <button type="button" class="mon" id="tvbtn" aria-pressed="false">Monitor view</button>
    </div>
  </header>

  <section class="banner" id="banner" aria-live="polite">
    <p class="tag" id="tag"></p>
    <p class="quip" id="quip"></p>

  </section>

  <div class="bar"><p class="stamp" id="stamp"></p></div>

  <section class="panel" id="pace"></section>
  <section class="panel" id="miles"></section>
  <section class="panel" id="glogwrap"></section>

  <footer class="foot" id="foot"></footer>
</div>

<div id="confetti" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="pickdlg" aria-labelledby="pk-title">
  <h2 id="pk-title">Choose players</h2>
  <p class="pk-note">Search any NHL skater by name. Your choice is remembered on this screen only.</p>
  <div id="pk-body"></div>
  <p class="pk-msg" id="pk-msg" role="status" aria-live="polite"></p>
  <button type="button" class="pk-btn" id="pk-close">Done</button>
</dialog>


<script>
/* Player picker: search any NHL skater and load his season from the NHL feed, right in the browser. */
(function(){
  var NHL = 'https://api-web.nhle.com/v1/';
  var SEARCH = 'https://search.d3.nhle.com/api/v1/search/player?culture=en-us&limit=10&active=true&q=';
  var KEY = 'players-v1';

      'To reach 50, {N} needs {NEED} goals a game from here. That is a big ask, not an impossible one.',
      'A slow start is still a start. {TO} goals to go.',
      '{N} is on track for {P}. The hot streak has not arrived yet.',
      'Each game left is a chance to flip the math.',
      '{G} so far. A two-goal night changes the whole picture.',
      'It is a long season. The pace line will have to wait up.',
      'The projection says {P}. The player says watch this.',
      '{N} needs a run. The schedule has {LEFT} games of room for one.'
    ],
    start: [
      'The chase has not started yet. 50 is a long way off and so is the first puck drop.',
      'No games played, so everyone is on pace for 82 goals and nobody can prove otherwise.',
      'Day one. Clean slate, zero pressure, 50 to go.'
    ]
  };
  var DYN = function(c){
    var q = [];
    if (c.stk.goal >= 3) q.push(c.N + ' has scored in ' + c.stk.goal + ' straight games.');
    if (c.stk.drought >= 3) q.push(c.N + ' is goalless in ' + c.stk.drought + ' and due for one.');
    if (c.last5 >= 4) q.push(c.last5 + ' goals in the last 5 games. That is the stuff of a 50-goal season.');
    if (c.multi >= 2) q.push(c.multi + ' multi-goal games already this season.');
    return q;
  };
  function fill(str, c){
    return str.replace(/\{(\w+)\}/g, function(m, k){ return c.t[k] !== undefined ? c.t[k] : m; });
  }
  function lastN(p, n){ return p.games.slice(-n).reduce(function(a, g){ return a + g.g; }, 0); }
  function possessive(n){ return /s$/i.test(n) ? n + '’' : n + '’s'; }

  function milestonesHtml(p, s, avg){
    var cum = cumulative(p, 'g'), rows = '';
    [10, 20, 30, 40, 50].forEach(function(M){
      var idx = -1;
      for (var i = 1; i < cum.length; i++){ if (cum[i] >= M){ idx = i; break; } }
      if (idx > 0){
        rows += '<li class="hit"><span class="m">' + M + '</span><span class="w">Reached in game ' + idx + ' (' + esc(fmtDate(p.games[idx - 1].d)) + ' vs ' + esc(p.games[idx - 1].o) + ')</span></li>';
      } else {
        var when;
        if (avg > 0){
          var gm = s.gp + Math.ceil((M - s.g) / avg);
          when = gm <= SEASON_GAMES ? 'Projected: game ' + gm : 'Not before game 82 at this pace';
        } else when = 'No goals yet to project from';
        rows += '<li class="prj"><span class="m">' + M + '</span><span class="w">' + when + '</span></li>';
      }
    });
    return '<h2>Milestones</h2><p class="sub">Each step on the way to 50, and when it lands.</p><ol class="miles">' + rows + '</ol>';
  }

  function paceChartHtml(p, s, avg, dim){
    var W = 720, H = 300, L = 36, R = 14, T = 16, B = 28;
    if (dim && dim.w > 200 && dim.h > 100){ W = Math.round(dim.w); H = Math.round(dim.h); }
    var proj = s.g + avg * Math.max(SEASON_GAMES - s.gp, 0);
    var top = Math.max(50, Math.ceil(Math.max(proj, s.g) / 10) * 10);
    var X = function(i){ return L + (W - L - R) * i / SEASON_GAMES; };
    var Y = function(v){ return T + (H - T - B) * (1 - v / top); };
    var g = '';
    for (var v = 0; v <= top; v += 10) g += '<line class="gridline" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/><text class="axis" x="' + (L - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + v + '</text>';
    [0, 20, 40, 60, 82].forEach(function(i){ g += '<text class="axis" x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? 'start' : (i === 82 ? 'end' : 'middle')) + '">' + (i === 0 ? 'Game 0' : i) + '</text>'; });
    var cum = cumulative(p, 'g');
    var pts = cum.map(function(c, i){ return X(i).toFixed(1) + ',' + Y(c).toFixed(1); }).join(' ');
    var area = 'M' + X(0).toFixed(1) + ',' + Y(0).toFixed(1) + ' L' + pts.replace(/ /g, ' L') + ' L' + X(s.gp).toFixed(1) + ',' + Y(0).toFixed(1) + ' Z';
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Goals by game compared with the pace needed for 50" preserveAspectRatio="xMidYMid meet">' + g +
      '<line class="pc-50" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(50).toFixed(1) + '" y2="' + Y(50).toFixed(1) + '"/>' +
      '<line class="pc-tgt" x1="' + X(0).toFixed(1) + '" y1="' + Y(0).toFixed(1) + '" x2="' + X(SEASON_GAMES).toFixed(1) + '" y2="' + Y(50).toFixed(1) + '"/>';
    if (s.gp < SEASON_GAMES && s.gp > 0) out += '<line class="pc-prj" x1="' + X(s.gp).toFixed(1) + '" y1="' + Y(s.g).toFixed(1) + '" x2="' + X(SEASON_GAMES).toFixed(1) + '" y2="' + Y(proj).toFixed(1) + '"/>';
    out += '<path class="pc-area" d="' + area + '"/><polyline class="pc-line" points="' + pts + '"/>' +
      '<circle class="d-mat" cx="' + X(s.gp).toFixed(1) + '" cy="' + Y(s.g).toFixed(1) + '" r="5"/>' +
      '<text class="t-mat" x="' + (X(s.gp) + (s.gp > 70 ? -10 : 10)).toFixed(1) + '" y="' + (Y(s.g) - 10).toFixed(1) + '" text-anchor="' + (s.gp > 70 ? 'end' : 'start') + '">' + s.g + '</text>' +
      '<text class="axis" x="' + (W - R - 4) + '" y="' + (Y(50) - 6).toFixed(1) + '" text-anchor="end">50 goals</text></svg>';
    return '<h2>Goals against the pace</h2><p class="sub">The solid line is his season. The dashed line is the steady pace that ends at exactly 50.</p>' + out +
      '<div class="key"><span><i></i>Goals so far</span><span><i class="t"></i>Pace needed for 50</span><span><i class="p"></i>Where he finishes at this rate</span></div>';
  }

  function logHtml(p){
    var rows = p.games.slice(-10).reverse(), run = 0, tot = [];
    p.games.forEach(function(x){ run += x.g; tot.push(run); });
    var start = p.games.length - rows.length;
    var body = rows.map(function(x, i){
      var idx = p.games.length - 1 - i;
      return '<tr><td>' + esc(fmtDate(x.d)) + '</td><td>' + esc(x.o) + '</td><td class="' + (x.g ? 'gz' : '') + '">' + x.g + '</td><td>' + tot[idx] + '</td></tr>';
    }).join('');
    return '<h2>Game by game</h2><p class="sub">His last ' + rows.length + ' games and the running total.</p><div class="scroll"><table class="log"><thead><tr><th>Date</th><th>Opponent</th><th>Goals</th><th>Total</th></tr></thead><tbody>' + body + '</tbody></table></div>';
  }

  function factsHtml(p, s, avg){
    var st = streaksOf(p), multi = p.games.filter(function(x){ return x.g >= 2; }).length;
    var scored = p.games.filter(function(x){ return x.g >= 1; }).length;
    var best = 0, run = 0;
    p.games.forEach(function(x){ run = x.g >= 1 ? run + 1 : 0; if (run > best) best = run; });
    var projGame = s.g >= GOAL ? 'Done' : (avg > 0 ? (s.gp + Math.ceil((GOAL - s.g) / avg) <= SEASON_GAMES ? 'Game ' + (s.gp + Math.ceil((GOAL - s.g) / avg)) : 'After 82') : '–');
    function tile(dt, dd, sub){ return '<div class="fact"><dt>' + dt + '</dt><dd>' + dd + '<span class="fsub">' + sub + '</span></dd></div>'; }
    return tile('Goals to go', Math.max(GOAL - s.g, 0), 'to reach 50') +
      tile('50th goal', projGame, 'at the current pace') +
      tile('Last 5 games', lastN(p, 5), 'goals') +
      tile('Games with a goal', scored + ' of ' + s.gp, 'this season') +
      tile('Multi-goal games', multi, 'two or more goals') +
      tile('Best scoring streak', best, st.goal ? 'now on ' + st.goal : 'games in a row');
  }

  function render(){
    if (!DATA || !DATA.players || !DATA.players.length){
      $('#track').innerHTML = '<div class="empty">No stats yet. The next scheduled refresh will fill this in.</div>';
      return;
    }
    var p = current();
    if (!p || !p.games || !p.games.length){
      $('#track').innerHTML = '<div class="empty">Waiting for the first game of the season.</div>';
      return;
    }
    var N = lastName(p), F = firstName(p);
    var s = summarize(p);
    var avg = s.gp ? s.g / s.gp : 0;
    var left = Math.max(SEASON_GAMES - s.gp, 0);
    var proj = s.g + avg * left;
    var need = left ? Math.max(GOAL - s.g, 0) / left : 0;
    var state = s.g >= GOAL ? 'done' : (!s.gp ? 'start' : (proj >= GOAL ? 'ahead' : 'behind'));

    $('#h1').textContent = possessive(N) + ' drive for 50';
    document.title = possessive(N) + ' drive for 50';
    var gb = gameBadge(p);
    gameRowOn = !!gb;
    $('#meta').innerHTML = '<div class="nm"><strong class="pn">' + esc(p.name) + '</strong><span class="pt">' + esc([p.abbr, p.pos, p.num ? '#' + p.num : ''].filter(Boolean).join(' · ')) + '</span>' + highlightHtml(p, s) + '</div>' + (gb ? gameRowHtml(p) : '');
    renderTrack(s, p);
    $('#track').className = 'track' + (state === 'done' ? ' done' : '');

    var c = { N:N, stk:streaksOf(p), last5:lastN(p, 5), multi:p.games.filter(function(x){ return x.g >= 2; }).length,
      t:{ N:N, F:F, G:s.g, GP:s.gp, P:Math.floor(proj), AVG:avg.toFixed(2), NEED:need.toFixed(2), LEFT:left, TO:Math.max(GOAL - s.g, 0) } };
    var pool = POOLS[state].map(function(q){ return fill(q, c); });
    DYN(c).forEach(function(q){ pool.push(q, q); });
    var seed = hash((DATA.updatedAt || '').slice(0, 10) + p.name + state);
    $('#quip').textContent = pool[(seed + quipShift) % pool.length];
    $('#banner').className = 'banner ' + (state === 'done' || state === 'ahead' ? 'is-mat' : '');
    $('#tag').textContent = state === 'done' ? N + ' hit 50' : (state === 'start' ? 'Season not started' : (Math.max(GOAL - s.g, 0) + ' to go · ' + (state === 'ahead' ? 'on pace for ' : 'pace says ') + Math.floor(proj)));

    $('#facts').innerHTML = factsHtml(p, s, avg);
    $('#pace').innerHTML = paceChartHtml(p, s, avg);
    if (tvKind()){
      var sv0 = $('#pace svg'), r0 = sv0 && sv0.getBoundingClientRect();
      if (r0 && (Math.abs(r0.width - 720) > 4 || Math.abs(r0.height - 300) > 4)){
        $('#pace').innerHTML = paceChartHtml(p, s, avg, { w:r0.width, h:r0.height });
      }
    }
    $('#miles').innerHTML = milestonesHtml(p, s, avg);
    $('#glogwrap').innerHTML = logHtml(p);

    var eff = s.g + liveGoals(p);
    if (quiet || !seen){ seen = { m:eff }; quiet = false; }
    else if (eff > seen.m){
      var hit = [10, 20, 30, 40, 50].filter(function(M){ return seen.m < M && eff >= M; })[0];
      toast('mat', (p.live && p.live.g >= 3 ? 'Hat trick! ' : '') + N + ' scores!', eff + (eff === 1 ? ' goal' : ' goals') + (eff >= GOAL ? '. Fifty reached!' : '. ' + (GOAL - eff) + ' to go for 50.') + (hit ? ' Milestone: ' + hit + '!' : ''));
      requestAnimationFrame(burst);
      seen.m = eff;
    }
    if (state === 'done' && lastDone === false && !autoReloaded) requestAnimationFrame(burst);
    lastDone = state === 'done';
    fitBadges();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBadges);
    setCtrlWidth();

    var lastDate = p.games[p.games.length - 1].d;
    var upd = DATA.updatedAt ? new Date(DATA.updatedAt) : null;
    var stale = upd && (Date.now() - upd.getTime()) > 40 * 3600 * 1000;
    $('#foot').innerHTML =
      '<p>Projection = goals per game so far x 82 games, assuming he plays every remaining game. Regular season only.</p>' +
      '<p>Counts every game through ' + esc(fmtDate(lastDate)) + '. ' + (upd ? 'Last refreshed ' + upd.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) + '.' : '') + '</p>' +
      (stale ? '<p class="stale">Heads up: the last refresh was more than a day and a half ago, so these numbers may be behind.</p>' : '');
    var stampEl = $('#stamp');
    stampEl.className = 'stamp' + (stale ? ' stale' : '');
    stampEl.textContent = upd ? (stale ? 'Data may be out of date. Last updated ' : 'Updated ') + upd.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '';
  }

  $('#again').addEventListener('click', function(){ quipShift++; render(); });
  function setCtrlWidth(){
    var c = $('.ctrls');
    if (c) document.documentElement.style.setProperty('--ctrlw', Math.ceil(c.getBoundingClientRect().width) + 'px');
  }
  if (HOSTED && window.Pick){
    $('#pickbtn').hidden = false;
    $('#navlink').hidden = false;
    var sv = window.Pick.saved();
    if (sv.d1 && sv.d1.id) window.Pick.loadPlayer(sv.d1.id).then(function(pl){ custom = pl; seen = null; render(); }, function(){});
    $('#pickbtn').addEventListener('click', function(){
      window.Pick.open({
        title:'Choose the player to follow',
        slots:[{ key:'d1', label:'Player', def:'Auston Matthews' }],
        onChange:function(key, pl){ custom = pl; seen = null; lastDone = null; render(); }
      });
    });
    setInterval(function(){
      if (custom) window.Pick.loadPlayer(custom.nhlId).then(function(np){ custom = np; render(); }, function(){});
    }, 10 * 60 * 1000);
  }
  applyTv();
  $('#tvbtn').addEventListener('click', function(){
    tvOn = !tvOn;
    try { localStorage.setItem('monitor-view', tvOn ? '1' : '0'); } catch (e) {}
    applyTv();
    render();
  });
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ if (tvOn) render(); }, 200);
  });
  var started = false;
  // Hosted version: pull fresh numbers from data.json (updated by the scheduled GitHub job),
  // keep the screen awake where the browser allows it, and reload the page every few hours to pick up site changes.
  var lastRaw = '', firstLoad = true;
  function load(){
    if (!window.fetch) return null;
    return fetch('data.json?_=' + Date.now(), { cache:'no-store' })
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(txt){
        if (!txt || txt === lastRaw) return;
        var j = JSON.parse(txt);
        if (!j || !j.players || j.players.length < 1) return;
        lastRaw = txt;
        DATA = j;
        // The first fresh numbers are the starting point, not a goal, so no celebration for them.
        if (started){ if (firstLoad) quiet = true; } else { started = true; }
        firstLoad = false;
        render();
      })
      .catch(function(){});
  }
  // Check every 10 minutes normally, and every 90 seconds around game time so live scores feel live.
  function pollDelay(){
    var now = Date.now(), fast = false;
    ((DATA && DATA.players) || []).forEach(function(p){
      if (p.live) fast = true;
      (p.sched || []).forEach(function(g){
        var s = new Date(g.s).getTime();
        if (now >= s - 30 * 60000 && now <= s + 6 * 3600000) fast = true;
      });
    });
    return fast ? 90 * 1000 : 10 * 60 * 1000;
  }
  function loop(){
    var again = function(){ setTimeout(loop, pollDelay()); };
    var pr = load();
    if (pr && pr.then) pr.then(again, again); else again();
  }
  loop();
  setInterval(function(){
    try { sessionStorage.setItem('autoreload', '1'); } catch (e) {}
    location.reload();
  }, 6 * 3600 * 1000);
  function keepAwake(){
    try {
      if (navigator.wakeLock && document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').catch(function(){});
      }
    } catch (e) {}
  }
  keepAwake();
  document.addEventListener('visibilitychange', keepAwake);
  // Wait briefly for the fresh numbers so the page never flashes stale ones; fall back to the built-in copy if the fetch is slow.
  setTimeout(function(){ if (!started){ started = true; render(); } }, 2500);
})();
</script>
</body>
</html>
